spring.application.name=medicalfield-central-service
server.port=8081

# PostgreSQL Central Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/medicalfield_central
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Secret (Chave com pelo menos 256 bits)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

medicalfield.api.key=${MEDICALFIELD_API_KEY:medicalfield-secret-key-2026}

audit.service.url=http://audit-service:8082/api/v1/auditoria/eventos
