<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicalField - Login Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card border-0 shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-header bg-primary text-white text-center py-3">
        <h5 class="mb-0 fw-bold">MedicalField Central</h5>
        <small>Acesso Restrito à Regulação Médica</small>
    </div>
    <div class="card-body p-4">

        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            CRM ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
            Sessão encerrada com sucesso.
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Registro Profissional (CRM)</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Ex: CRM12345" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Senha</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Digite sua senha" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary fw-semibold">Entrar na Central</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
