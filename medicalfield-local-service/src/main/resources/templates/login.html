<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MedicalField - Ambulância (Login)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { color: #d9534f; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0275d8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #025aa5; }
        .alert { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>MedicalField Local</h2>
        <p style="text-align: center; font-size: 12px; color: #666;">Atendimento Pré-Hospitalar (Offline-First)</p>
        
        <div th:if="${erro}" class="alert" th:text="${erro}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="registroProfissional">Registro (CRM / COREN / ID):</label>
                <input type="text" id="registroProfissional" name="registroProfissional" placeholder="Ex: CRM12345" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            <button type="submit">Autenticar no Servidor Central</button>
        </form>
    </div>
</body>
</html>
