<!-- PRONTUÁRIO CLÍNICO DO PACIENTE -->
            <div class="section-box">
                <div class="section-title">Prontuário Clínico (Histórico do Paciente)</div>
                <input type="hidden" th:field="*{prontuario.id}" th:if="${ficha.prontuario != null and ficha.prontuario.id != null}">
                <div class="form-row">
                    <div class="form-col" style="flex: 1;">
                        <label>Tipo Sanguíneo:</label>
                        <select th:field="*{prontuario.tipoSanguineo}">
                            <option value="">Não informado</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-col" style="flex: 2;">
                        <label>Alergias Conhecidas:</label>
                        <input type="text" th:field="*{prontuario.alergias}" placeholder="Ex: Dipirona, Penicilina, Látex ou Nenhuma">
                    </div>
                </div>
                <div class="form-row" style="margin-top: 10px;">
                    <div class="form-col">
                        <label>Comorbidades / Doenças Crônicas:</label>
                        <input type="text" th:field="*{prontuario.comorbidades}" placeholder="Ex: Hipertensão, Diabetes Tipo 2, Asma">
                    </div>
                    <div class="form-col">
                        <label>Medicamentos de Uso Contínuo:</label>
                        <input type="text" th:field="*{prontuario.medicamentosUsoContinuo}" placeholder="Ex: Losartana 50mg, Metformina">
                    </div>
                </div>
            </div>
